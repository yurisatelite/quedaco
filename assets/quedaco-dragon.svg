<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="QUEDAÇO — dragão em queda">
  <defs>
    <linearGradient id="q-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfeeff"/>
      <stop offset="0.5" stop-color="#63c8e6"/>
      <stop offset="1" stop-color="#2b8fb4"/>
    </linearGradient>
    <linearGradient id="q-wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fa6c6"/>
      <stop offset="1" stop-color="#186a86"/>
    </linearGradient>
  </defs>

  <!-- estilhaços: continente partido caindo -->
  <g stroke="#0b2530" stroke-width="2" stroke-linejoin="round">
    <path d="M96 12 L112 20 L104 33 L90 27 Z" fill="#2b8fb4"/>
    <path d="M108 44 L120 52 L112 62 Z" fill="#1f7f9e"/>
    <path d="M18 96 L30 92 L34 104 L22 110 Z" fill="#2b8fb4"/>
    <path d="M100 96 L110 100 L104 112 L94 106 Z" fill="#186a86"/>
    <path d="M12 62 L20 58 L22 70 L13 72 Z" fill="#1f7f9e"/>
  </g>

  <!-- dragão parteado em queda: cabeça para baixo-esquerda, cauda e asas para cima -->
  <g stroke="#0b2530" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- asa traseira -->
    <path d="M74 46 C92 28 112 30 118 40 C104 44 98 56 96 70 C86 60 78 56 70 58 Z" fill="url(#q-wing)"/>
    <!-- cauda enrolada subindo -->
    <path d="M78 44 C96 40 108 52 104 70 C102 60 94 56 86 60 C90 52 86 46 78 48 Z" fill="#2b8fb4"/>
    <!-- corpo atarracado -->
    <path d="M40 92 C30 78 34 60 50 52 C64 45 82 48 88 62 C92 74 86 88 72 94 C60 99 48 100 40 92 Z" fill="url(#q-body)"/>
    <!-- barriga em placas -->
    <path d="M46 86 C42 74 46 62 56 58 C52 68 54 80 62 88 C56 91 50 90 46 86 Z" fill="#d6f6ff" stroke-width="2"/>
    <!-- asa dianteira dobrada -->
    <path d="M58 60 C44 46 26 44 18 54 C32 56 40 68 42 82 C50 70 56 64 66 66 Z" fill="url(#q-wing)"/>
    <!-- patinha -->
    <path d="M60 92 C58 100 52 106 44 108 C48 100 48 96 46 92 Z" fill="#2b8fb4"/>
    <!-- cabeça de kobold: focinho curto, chifres -->
    <path d="M40 92 C30 96 22 94 18 86 C22 84 24 80 22 76 C30 74 38 78 42 86 Z" fill="url(#q-body)"/>
    <path d="M24 78 L16 72 L26 72 Z" fill="#2b8fb4"/>
    <path d="M28 74 L24 64 L34 70 Z" fill="#2b8fb4"/>
  </g>

  <!-- olho grande e meio bobo -->
  <circle cx="31" cy="84" r="3.4" fill="#0b2530"/>
  <circle cx="32.4" cy="82.8" r="1.2" fill="#eafcff"/>

  <!-- corte no peito -->
  <path d="M58 70 l6 4 l-3 3 l5 4" fill="none" stroke="#d65f4a" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M58 70 l6 4 l-3 3 l5 4" fill="none" stroke="#ffd8cf" stroke-width="1.1" stroke-linecap="round"/>
</svg>
