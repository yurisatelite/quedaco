<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="QUEDAÇO — dragão em queda">
  <defs>
    <linearGradient id="qd-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6f6ff"/><stop offset="0.45" stop-color="#6ccde8"/><stop offset="1" stop-color="#227fa3"/>
    </linearGradient>
    <linearGradient id="qd-wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aaecd"/><stop offset="1" stop-color="#12566e"/>
    </linearGradient>
    <radialGradient id="qd-wound" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe3f1"/><stop offset="0.4" stop-color="#e64c92"/><stop offset="1" stop-color="#6e2650"/>
    </radialGradient>
  </defs>

  <!-- estilhaços do continente, caindo -->
  <g stroke="#0a2431" stroke-width="2" stroke-linejoin="round" opacity="0.9">
    <path d="M104 16 L118 22 L112 34 L100 29 Z" fill="#227fa3"/>
    <path d="M110 46 L122 54 L114 64 Z" fill="#164f66"/>
    <path d="M12 84 L24 80 L28 92 L16 98 Z" fill="#227fa3"/>
    <path d="M14 52 L22 49 L23 60 L13 62 Z" fill="#164f66"/>
  </g>

  <g stroke="#0a2431" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- asa esquerda espalhada -->
    <path d="M60 52 C40 30 16 26 6 40 C20 42 24 54 22 68 C20 82 26 92 36 96 C40 82 46 70 60 66 Z" fill="url(#qd-wing)"/>
    <path d="M22 44 L20 64 M30 46 L30 78 M40 50 L42 84" stroke="#0a2431" stroke-width="2" fill="none"/>
    <!-- asa direita espalhada -->
    <path d="M68 52 C88 30 112 26 122 40 C108 42 104 54 106 68 C108 82 102 92 92 96 C88 82 82 70 68 66 Z" fill="url(#qd-wing)"/>
    <path d="M106 44 L108 64 M98 46 L98 78 M88 50 L86 84" stroke="#0a2431" stroke-width="2" fill="none"/>
    <!-- cauda subindo atrás -->
    <path d="M64 60 C78 44 92 44 96 24 C88 34 78 34 72 44 C74 34 70 30 64 34 Z" fill="#227fa3"/>
    <!-- torso de frente, afunilando p/ baixo -->
    <path d="M64 40 C52 42 44 54 46 72 C48 92 56 108 64 116 C72 108 80 92 82 72 C84 54 76 42 64 40 Z" fill="url(#qd-body)"/>
    <!-- placas do ventre -->
    <path d="M64 56 C58 60 56 70 58 82 C60 94 64 104 64 104 C64 104 68 94 70 82 C72 70 70 60 64 56 Z" fill="#e6faff" stroke-width="2"/>
    <!-- patas dianteiras recolhidas -->
    <path d="M50 74 C44 78 40 86 40 94 C46 90 50 88 54 88 Z" fill="#227fa3"/>
    <path d="M78 74 C84 78 88 86 88 94 C82 90 78 88 74 88 Z" fill="#227fa3"/>
    <!-- pernas traseiras arrastando -->
    <path d="M58 104 C54 112 52 120 50 124 C56 118 60 114 62 110 Z" fill="#1f7f9e"/>
    <path d="M70 104 C74 112 76 120 78 124 C72 118 68 114 66 110 Z" fill="#1f7f9e"/>
    <!-- cabeça baixada, chifres p/ trás -->
    <path d="M56 40 C54 30 58 22 64 20 C70 22 74 30 72 40 C68 44 60 44 56 40 Z" fill="url(#qd-body)"/>
    <path d="M58 24 L52 14 L62 20 Z" fill="#1f7f9e"/>
    <path d="M70 24 L76 14 L66 20 Z" fill="#1f7f9e"/>
    <!-- crista dorsal -->
    <path d="M64 36 l4 6 -4 3 -4 -3 Z" fill="#1f7f9e" stroke-width="2"/>
  </g>

  <!-- olhos estreitos -->
  <path d="M60 32 l4 1.5" stroke="#0a2431" stroke-width="3" stroke-linecap="round"/>
  <path d="M68 32 l-4 1.5" stroke="#0a2431" stroke-width="3" stroke-linecap="round"/>

  <!-- ferida no peito -->
  <path d="M64 62 l7 -3 -3 6 6 3 -7 2 3 6 -6 -3 -3 6 -3 -6 -6 3 3 -6 -7 -2 7 -3 -3 -6 6 3 Z" fill="url(#qd-wound)" stroke="#3a132c" stroke-width="1.4"/>
  <circle cx="64" cy="66" r="2" fill="#fff0f7"/>
</svg>
